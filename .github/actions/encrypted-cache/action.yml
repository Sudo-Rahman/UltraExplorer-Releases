name: Encrypted build cache
description: Persist authenticated encrypted Cargo, pnpm or BuildKit files in the public repository
inputs:
  mode:
    description: restore or save
    required: true
  group:
    description: Stable cache family
    required: true
  kind:
    description: native, frontend or docker
    required: true
  dependency-key:
    description: Lockfile fingerprint
    required: true
  encryption-key:
    description: Dedicated base64 AES-256 key
    required: true
runs:
  using: composite
  steps:
    - id: location
      shell: bash
      env:
        CACHE_GROUP: ${{ inputs.group }}
        CACHE_KIND: ${{ inputs.kind }}
        CACHE_DEPENDENCY: ${{ inputs.dependency-key }}
        PRIVATE_BUILD_CACHE_KEY: ${{ inputs.encryption-key }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/private-cache.mjs" init
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.location.outputs.directory }}
        key: ${{ steps.location.outputs.key }}
        restore-keys: |
          ${{ steps.location.outputs.prefix }}
          ${{ steps.location.outputs.fallback }}
    - id: archive
      shell: bash
      env:
        CACHE_GROUP: ${{ inputs.group }}
        CACHE_KIND: ${{ inputs.kind }}
        PRIVATE_BUILD_CACHE_KEY: ${{ inputs.encryption-key }}
        CACHE_MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/private-cache.mjs" "$CACHE_MODE"
    - if: inputs.mode == 'restore' && inputs.kind != 'docker'
      shell: bash
      run: |
        if command -v pnpm >/dev/null 2>&1; then
          pnpm config set store-dir "$GITHUB_WORKSPACE/.pnpm-store"
        fi
    - if: inputs.mode == 'save' && steps.archive.outputs.available == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.location.outputs.directory }}
        key: ${{ steps.location.outputs.key }}
