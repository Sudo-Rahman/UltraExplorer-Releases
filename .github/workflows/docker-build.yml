name: Build native container images

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      ULTRAEXPLORER_DEPLOY_KEY:
        required: true
      PRIVATE_BUILD_CACHE_KEY:
        required: true

env:
  IMAGE: ghcr.io/sudo-rahman/ultra-explorer
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  native:
    name: Container ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - name: Validate immutable inputs and native architecture
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          MACHINE: ${{ matrix.machine }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(uname -m)" = "$MACHINE"
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore encrypted BuildKit cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: docker
          kind: docker
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - name: Download validated web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-ui-encrypted
          path: web-artifact
      - name: Restore validated web build
        env:
          PRIVATE_BUILD_CACHE_KEY: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node ../release-tools/scripts/encrypted-archive.mjs unpack ../web-artifact/web-ui.enc apps/ui/build "web-ui/$SOURCE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the native runtime once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          platforms: linux/${{ matrix.arch }}
          build-args: UI_STAGE=ui-prebuilt
          load: true
          push: false
          provenance: false
          tags: ultra-explorer:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=local,src=buildkit-cache
          cache-to: type=local,dest=buildkit-cache-next,mode=max
      - name: Test the exact native image
        run: bash ./scripts/docker-smoke.sh ultra-explorer:ci
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image without rebuilding
        id: push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          candidate="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag ultra-explorer:ci "$IMAGE:$candidate"
          docker push "$IMAGE:$candidate"
          docker image inspect "$IMAGE:$candidate" --format '{{json .RepoDigests}}' > image-digests.json
          node ../release-tools/scripts/container-digest.mjs image-digests.json "$IMAGE" "../digests/$ARCH.txt" >> "$GITHUB_OUTPUT"
      - name: Attest the tested image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sudo-rahman/ultra-explorer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Share the immutable image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error
      - name: Rotate BuildKit cache
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          if [ -f buildkit-cache-next/index.json ]; then
            rm -rf buildkit-cache
            mv buildkit-cache-next buildkit-cache
          fi
      - name: Save encrypted BuildKit cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: docker
          kind: docker
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
