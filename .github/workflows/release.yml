name: Publish release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing private main tag matching the Cargo version (vX.Y.Z)
        required: true
        type: string

env:
  CARGO_INCREMENTAL: "0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  quality:
    name: Run the complete quality gate
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.validate-release.outputs.source_sha }}
      release_build: true
    secrets: inherit

  validate-release:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
      matrix: ${{ steps.request.outputs.matrix }}
    steps:
      - name: Require release tooling from main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate release request
        id: request
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: node release-tools/scripts/release-inputs.mjs
      - name: Test public release tooling
        run: node --test release-tools/tests/*.test.mjs
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ steps.request.outputs.ref }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Require the private tag to belong to main
        working-directory: source
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The selected private tag is not part of main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - name: Require the Cargo application version to match the release
        working-directory: source
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: node scripts/application-version.mjs "$VERSION"
      - name: Reject an existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
      - name: Export the immutable private source revision
        id: release
        working-directory: source
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.artifact }}
    needs: [quality, validate-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ needs.validate-release.outputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore encrypted desktop cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: desktop
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare Unix rclone sidecar
        if: runner.os != 'Windows'
        run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prepare Windows rclone sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-rclone-sidecar.ps1
      - name: Require native Apple Silicon for macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "macOS artifacts require an arm64 runner; refusing to publish under an ARM64 platform key" >&2
            exit 1
          fi
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/ultra-developer-id.p12"
          API_KEY_DIRECTORY="$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APPLE_API_KEY}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/ultra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
            echo "APPLE_CERTIFICATE_PATH=$CERTIFICATE_PATH"
            echo "APPLE_SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
      - name: Build the selected signed updater distribution
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          pnpm desktop:build --ci --distribution "$DISTRIBUTION"
      - name: Notarize and staple the macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          DMG_PATH="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vv --type exec "$APP_PATH"
      - name: Collect exact updater payload and its signature
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: node ../release-tools/scripts/updater-manifest.mjs collect target/release/bundle release-files "$PLATFORM" "$VERSION"
      - name: Upload installable bundles only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: source/release-files/*
          if-no-files-found: error
          retention-days: 1
      - name: Clean up Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${APPLE_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "${APPLE_API_KEY_PATH:-}" "${APPLE_CERTIFICATE_PATH:-}"
      - name: Save encrypted desktop cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: desktop
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}

  build-docker:
    name: Build and test native containers
    needs: [quality, validate-release]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ needs.validate-release.outputs.source_sha }}
      version: ${{ needs.validate-release.outputs.version }}
    secrets: inherit

  publish-docker:
    name: Publish the tested multi-architecture image
    needs: [quality, validate-release, build-desktop, build-docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/sudo-rahman/ultra-explorer
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download tested image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true
      - name: Publish the complete architecture index
        id: publish
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: node release-tools/scripts/publish-container.mjs digests "$IMAGE" "$VERSION"
      - name: Attest the multi-architecture index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sudo-rahman/ultra-explorer
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Create the public GitHub Release
    needs: [validate-release, build-desktop, publish-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download all desktop bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: downloaded-assets
          merge-multiple: false
      - name: Validate complete signed platform manifest
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: node release-tools/scripts/updater-manifest.mjs assemble downloaded-assets release-assets "$VERSION"
      - name: Generate SHA-256 checksums and release notes
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ..
          cat > release-notes.md <<EOF
          Ultra Explorer $VERSION

          Built and tested from private source revision \`$SOURCE_SHA\`.
          EOF
          printf '\nContainer: ghcr.io/sudo-rahman/ultra-explorer:%s\n' "$VERSION" >> release-notes.md
      - name: Attest desktop release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Stage all assets then publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            --title "Ultra Explorer $VERSION" --notes-file release-notes.md --draft)
          gh release create "${args[@]}"
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > uploaded-release.json
          node release-tools/scripts/updater-manifest.mjs verify release-assets uploaded-release.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
