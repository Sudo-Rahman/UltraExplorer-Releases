name: Publish release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable full release or isolated public macOS updater test
        required: true
        default: stable
        type: choice
        options: [stable, updater-test]
      source_tag:
        description: Stable only - existing private main version tag
        required: false
        type: string
      source_sha:
        description: Test only - exact private source commit (need not be on main)
        required: false
        type: string
      test_version:
        description: Test only - e.g. 0.1.1-updater.1 then 0.1.1-updater.2
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  quality:
    name: Run the complete quality gate
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.validate-release.outputs.source_sha }}
      desktop_platform: ${{ inputs.channel == 'updater-test' && 'macos' || 'all' }}
      skip_docker: ${{ inputs.channel == 'updater-test' }}
    secrets: inherit

  validate-release:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
      matrix: ${{ steps.request.outputs.matrix }}
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate release request
        id: request
        env:
          CHANNEL: ${{ inputs.channel }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: node release-tools/scripts/release-inputs.mjs
      - name: Test public release tooling
        run: node --test release-tools/tests/*.test.mjs
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ steps.request.outputs.ref }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Require the private tag to belong to main
        if: inputs.channel == 'stable'
        working-directory: source
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The selected private tag is not part of main" >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Require every canonical package version to match the release
        if: inputs.channel == 'stable'
        working-directory: source
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const expected = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(
            readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')
          ).version;
          const cargo = readFileSync('Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/\[workspace\.package\][\s\S]*?version\s*=\s*"([^"]+)"/)?.[1];

          for (const [name, actual] of [
            ['package.json', packageVersion],
            ['tauri.conf.json', tauriVersion],
            ['Cargo.toml', cargoVersion]
          ]) {
            if (actual !== expected) {
              throw new Error(`${name} version ${actual ?? '<missing>'} does not match ${expected}`);
            }
          }
          NODE
      - name: Reject an existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
      - name: Export the immutable private source revision
        id: release
        working-directory: source
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$CHANNEL" == "updater-test" && "$(git rev-parse HEAD)" != "$REQUESTED_SHA" ]]; then
            echo "Checkout does not match requested immutable source" >&2
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.artifact }}
    needs: [quality, validate-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ needs.validate-release.outputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Prepare Unix rclone sidecar
        if: runner.os != 'Windows'
        run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prepare Windows rclone sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-rclone-sidecar.ps1
      - name: Require native Apple Silicon for macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "macOS artifacts require an arm64 runner; refusing to publish under an ARM64 platform key" >&2
            exit 1
          fi
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/ultra-developer-id.p12"
          API_KEY_DIRECTORY="$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APPLE_API_KEY}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/ultra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
            echo "APPLE_CERTIFICATE_PATH=$CERTIFICATE_PATH"
            echo "APPLE_SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
      - name: Build the selected signed updater distribution
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          args=(--ci --distribution "$DISTRIBUTION")
          if [[ "$CHANNEL" == "updater-test" ]]; then
            args+=(--update-channel updater-test --test-version "$VERSION")
          fi
          pnpm desktop:build "${args[@]}"
      - name: Notarize and staple the macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          DMG_PATH="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vv --type exec "$APP_PATH"
      - name: Collect exact updater payload and its signature
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: node ../release-tools/scripts/updater-manifest.mjs collect target/release/bundle release-files "$PLATFORM" "$VERSION" "$CHANNEL"
      - name: Upload installable bundles only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: source/release-files/*
          if-no-files-found: error
          retention-days: 1
      - name: Clean up Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${APPLE_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "${APPLE_API_KEY_PATH:-}" "${APPLE_CERTIFICATE_PATH:-}"

  build-docker:
    if: inputs.channel == 'stable'
    name: Publish multi-architecture container
    needs: [quality, validate-release, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ needs.validate-release.outputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/sudo-rahman/ultra-explorer
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.channel == 'stable' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
      - name: Build and publish the final runtime image
        id: container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Attest the container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sudo-rahman/ultra-explorer
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

  publish-release:
    if: ${{ always() && needs.validate-release.result == 'success' && needs.build-desktop.result == 'success' && (needs.build-docker.result == 'success' || (inputs.channel == 'updater-test' && needs.build-docker.result == 'skipped')) }}
    name: Create the public GitHub Release
    needs: [validate-release, build-desktop, build-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download all desktop bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: downloaded-assets
          merge-multiple: false
      - name: Validate complete signed platform manifest
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: node release-tools/scripts/updater-manifest.mjs assemble downloaded-assets release-assets "$VERSION" "$CHANNEL"
      - name: Generate SHA-256 checksums and release notes
        env:
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ..
          cat > release-notes.md <<EOF
          Ultra Explorer $VERSION

          Built and tested from private source revision \`$SOURCE_SHA\`.
          EOF
          if [[ "$CHANNEL" == "stable" ]]; then
            printf '\nContainer: ghcr.io/sudo-rahman/ultra-explorer:%s\n' "$VERSION" >> release-notes.md
          else
            printf '\nIsolated macOS updater test; not a stable release.\n' >> release-notes.md
          fi
      - name: Attest desktop release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Stage all assets then publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            --title "Ultra Explorer $VERSION" --notes-file release-notes.md --draft)
          if [[ "$CHANNEL" == "updater-test" ]]; then args+=(--prerelease --latest=false); fi
          gh release create "${args[@]}"
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          if [[ "$CHANNEL" == "stable" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
      - name: Advance isolated test feed after versioned assets are public
        if: inputs.channel == 'updater-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updater-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create updater-test --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Updater test feed" --notes "Isolated macOS prerelease feed; never stable." --draft --prerelease --latest=false
          fi
          gh release upload updater-test release-assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit updater-test --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
