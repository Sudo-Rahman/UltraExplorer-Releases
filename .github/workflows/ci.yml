name: Private source CI

on:
  workflow_dispatch:
    inputs:
      desktop_platform:
        description: Desktop test matrix (all or macos)
        required: false
        default: all
        type: string
      skip_docker:
        description: Skip container validation for isolated desktop tests
        required: false
        default: false
        type: boolean
      source_sha:
        description: Full 40-character commit SHA from Sudo-Rahman/UltraExplorer
        required: true
        type: string
  workflow_call:
    inputs:
      desktop_platform:
        description: Desktop test matrix (all or macos)
        required: false
        default: all
        type: string
      skip_docker:
        description: Skip container validation for isolated desktop tests
        required: false
        default: false
        type: boolean
      source_sha:
        description: Full 40-character commit SHA from Sudo-Rahman/UltraExplorer
        required: true
        type: string
    secrets:
      ULTRAEXPLORER_DEPLOY_KEY:
        required: true

env:
  ULTRA_PRODUCT_MODE: production
  ULTRA_DISTRIBUTION: development

permissions:
  contents: read

concurrency:
  group: private-source-ci-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate source revision
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require an exact commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

  frontend:
    name: Frontend and production PWA
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:branding
      - run: pnpm i18n:check
      - run: pnpm --filter @ultra/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @ultra/ui lint
      - run: pnpm --filter @ultra/ui check
      - run: pnpm test
      - run: pnpm --filter @ultra/ui build
      - run: node --test apps/ui/scripts/pwa-production.test.mjs

  end-to-end:
    name: Browser end-to-end
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ultra/ui exec playwright install --with-deps chromium
      - run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prebuild the E2E server outside Playwright's startup timeout
        run: cargo test --locked -p ultra-server --lib --no-run
      - run: pnpm --filter @ultra/ui test:e2e

  rust:
    name: Rust workspace
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: bash ./scripts/prepare-rclone-sidecar.sh
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  desktop-platforms:
    name: Desktop tests (${{ matrix.os }})
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.desktop_platform == 'macos' && '["macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Prepare Unix rclone sidecar
        if: runner.os != 'Windows'
        run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prepare Windows rclone sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-rclone-sidecar.ps1
      - run: cargo test --locked -p ultra-desktop --all-features
      - name: Build the complete Tauri application
        run: pnpm desktop:build --no-bundle --ci

  docker:
    if: ${{ !inputs.skip_docker }}
    name: Docker smoke test
    needs: [frontend, end-to-end, rust, desktop-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Validate Docker smoke script
        run: |
          bash -n ./scripts/docker-smoke.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck ./scripts/docker-smoke.sh
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          push: false
          load: true
          tags: ultra-explorer:ci
      - name: Smoke test the Docker runtime and persistent volume
        run: bash ./scripts/docker-smoke.sh ultra-explorer:ci
