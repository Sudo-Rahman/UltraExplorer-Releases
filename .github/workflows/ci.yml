name: Private source CI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA from Sudo-Rahman/UltraExplorer
        required: true
        type: string
  workflow_call:
    inputs:
      release_build:
        description: Packaging and per-architecture image tests are owned by the release jobs
        type: boolean
        default: false
      source_sha:
        description: Full 40-character commit SHA from Sudo-Rahman/UltraExplorer
        required: true
        type: string
    secrets:
      PRIVATE_BUILD_CACHE_KEY:
        required: true
      ULTRAEXPLORER_DEPLOY_KEY:
        required: true

env:
  ULTRA_PRODUCT_MODE: production
  ULTRA_DISTRIBUTION: development
  CARGO_INCREMENTAL: "0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

permissions:
  contents: read

concurrency:
  group: private-source-ci-${{ inputs.source_sha }}-${{ inputs.release_build && 'release' || 'ci' }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate source revision
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require an exact commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

  frontend:
    name: Frontend and production PWA
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore encrypted frontend cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: frontend-${{ inputs.release_build && 'main' || 'validation' }}
          kind: frontend
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:branding
      - run: pnpm i18n:check
      - run: pnpm --filter @ultra/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @ultra/ui lint
      - run: pnpm --filter @ultra/ui check
      - run: pnpm test
      - run: pnpm --filter @ultra/ui build
      - run: node --test apps/ui/scripts/pwa-production.test.mjs
      - name: Encrypt the validated web build
        env:
          PRIVATE_BUILD_CACHE_KEY: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node ../release-tools/scripts/encrypted-archive.mjs pack apps/ui/build ../web-ui.enc "web-ui/$SOURCE_SHA"
      - name: Share the validated web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-ui-encrypted
          overwrite: true
          path: web-ui.enc
          retention-days: 1
          if-no-files-found: error
      - name: Save encrypted frontend cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: frontend-${{ inputs.release_build && 'main' || 'validation' }}
          kind: frontend
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}

  end-to-end:
    name: Browser end-to-end
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - name: Restore encrypted e2e cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: e2e-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ultra/ui exec playwright install --with-deps chromium
      - run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prebuild the E2E server outside Playwright's startup timeout
        run: cargo test --locked -p ultra-server --lib --no-run
      - run: pnpm --filter @ultra/ui test:e2e
      - name: Save encrypted e2e cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: e2e-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}

  rust:
    name: Rust workspace
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Restore encrypted rust cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: rust-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - run: node scripts/application-version.mjs
      - run: cargo fmt --all --check
      - run: bash ./scripts/prepare-rclone-sidecar.sh
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Save encrypted rust cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: rust-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}

  desktop-platforms:
    name: Desktop tests (${{ matrix.os }})
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore encrypted desktop cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: desktop-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare Unix rclone sidecar
        if: runner.os != 'Windows'
        run: bash ./scripts/prepare-rclone-sidecar.sh
      - name: Prepare Windows rclone sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-rclone-sidecar.ps1
      - run: cargo test --locked -p ultra-desktop --all-features
      - name: Build the complete Tauri application
        if: ${{ !inputs.release_build }}
        env:
          ULTRA_DISTRIBUTION: ${{ runner.os == 'macOS' && 'macos-direct' || runner.os == 'Windows' && 'windows-direct' || 'linux-appimage' }}
        run: pnpm desktop:build --no-bundle --ci
      - name: Save encrypted desktop cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: desktop-${{ inputs.release_build && 'main' || 'validation' }}
          kind: native
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}

  docker:
    if: ${{ !inputs.release_build }}
    name: Docker smoke test
    needs: [frontend, end-to-end, rust, desktop-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: release-tools
      - name: Check out the private source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Sudo-Rahman/UltraExplorer
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.ULTRAEXPLORER_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Validate Docker smoke script
        run: |
          bash -n ./scripts/docker-smoke.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck ./scripts/docker-smoke.sh
          fi
      - name: Restore encrypted docker cache
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: restore
          group: docker-${{ inputs.release_build && 'main' || 'validation' }}
          kind: docker
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
      - name: Download validated web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-ui-encrypted
          path: web-artifact
      - name: Restore validated web build
        env:
          PRIVATE_BUILD_CACHE_KEY: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node ../release-tools/scripts/encrypted-archive.mjs unpack ../web-artifact/web-ui.enc apps/ui/build "web-ui/$SOURCE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          push: false
          load: true
          tags: ultra-explorer:ci
          build-args: UI_STAGE=ui-prebuilt
          cache-from: type=local,src=buildkit-cache
          cache-to: type=local,dest=buildkit-cache-next,mode=max
          provenance: false
      - name: Smoke test the Docker runtime and persistent volume
        run: bash ./scripts/docker-smoke.sh ultra-explorer:ci
      - name: Rotate BuildKit cache
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          if [ -f buildkit-cache-next/index.json ]; then
            rm -rf buildkit-cache
            mv buildkit-cache-next buildkit-cache
          fi
      - name: Save encrypted docker cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/encrypted-cache
        with:
          mode: save
          group: docker-${{ inputs.release_build && 'main' || 'validation' }}
          kind: docker
          dependency-key: ${{ hashFiles('source/Cargo.lock', 'source/pnpm-lock.yaml') }}
          encryption-key: ${{ secrets.PRIVATE_BUILD_CACHE_KEY }}
